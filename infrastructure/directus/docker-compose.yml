services:
  directus:
    image: directus/directus:11
    ports:
      - "8055:8055"
    env_file:
      - ../../.env
    environment:
      SECRET: "${DIRECTUS_SECRET}"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "ops_platform"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD}"
      ADMIN_TOKEN: "${DIRECTUS_ADMIN_TOKEN}"
      WEBSOCKETS_ENABLED: "true"
      FLOWS_EXEC_ALLOWED_MODULES: "true"
      EXTENSIONS_AUTO_RELOAD: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
    volumes:
      - ./extensions:/directus/extensions
      - ./schema:/directus/schema
      - directus_uploads:/directus/uploads
    command: >
      sh -c "
        node dist/cli/run.js bootstrap &&
        node dist/cli/run.js schema apply --yes /directus/schema/snapshot.yaml || echo 'Schema apply skipped (may already be applied)' &&
        node dist/cli/run.js start
      "
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8055/server/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: "ops_platform"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ops_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  directus_uploads:
